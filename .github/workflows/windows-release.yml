name: Verify and package Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      SMART_VRMS_RELEASE_API_URL: ${{ vars.SMART_VRMS_API_URL }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified official v4 revision
      - name: Use runner's preinstalled Java 17
        shell: pwsh
        run: |
          if (-not $env:JAVA_HOME_17_X64) { throw 'Preinstalled JDK 17 is required.' }
          "JAVA_HOME=$env:JAVA_HOME_17_X64" >> $env:GITHUB_ENV
          "$env:JAVA_HOME_17_X64/bin" >> $env:GITHUB_PATH
      - name: Resolve pinned dependencies and compile
        shell: pwsh
        run: |
          mvn -B package
          if ($LASTEXITCODE -ne 0) { throw 'Maven failed.' }
      - name: Package and verify
        shell: pwsh
        run: |
          .\scripts\package-desktop-windows.ps1
          .\scripts\export-server-bundle.ps1
          .\scripts\write-release-manifest.ps1
          .\scripts\verify.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified official v4 revision
        with:
          name: SmartVRMS-Windows-preview
          path: |
            dist/SmartVRMS-Windows-x64.zip
            dist/SHA256SUMS.txt
            docs/Release-Manifest.md
          if-no-files-found: error
          retention-days: 14
      - name: Publish reviewed preview tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Stable publication needs the unfinished production gates first.
          $versionLine = Select-String -Path desktop/src/main/java/in/smartvrms/desktop/infrastructure/AppVersion.java -Pattern 'CURRENT = "([^"]+)"'
          $version = $versionLine.Matches[0].Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version" -or -not $version.EndsWith('-preview')) { throw 'Tag must match the reviewed preview version. Stable release gates are incomplete.' }
          gh release create $env:RELEASE_TAG dist/SmartVRMS-Windows-x64.zip dist/SHA256SUMS.txt docs/Release-Manifest.md --verify-tag --prerelease --title "Smart VRMS $version" --notes-file docs/release-notes-preview.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; inspect existing release before retrying.' }
