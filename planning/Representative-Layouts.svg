<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="2510" viewBox="0 0 1320 2510" role="img" aria-labelledby="title desc">
<title id="title">Smart VRMS — proposed native Swing layouts</title>
<desc id="desc">Three conceptual layouts showing vehicle gallery and details, booking review, and a returned service with an unpaid balance. Fictional data. No application is implemented.</desc>
<defs>
  <style>
    text{font-family:'Segoe UI',Arial,sans-serif;fill:#172033;font-size:15px} .title{font-size:24px;font-weight:700}.h{font-size:19px;font-weight:700}.small{font-size:13px;fill:#475569}.light{fill:#dce6f5}.white{fill:#fff}.bold{font-weight:700}.blue{fill:#1d4ed8}.green{fill:#166534}.warn{fill:#92400e}.muted{fill:#475569}.line{stroke:#cbd5e1;stroke-width:1}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1}.btn{fill:#1d4ed8}.pill{fill:#e7f3eb}.status{font-size:13px;font-weight:700}.nav{fill:#c4d1e5;font-size:15px}.navactive{fill:#fff;font-weight:700}.money{font-size:21px;font-weight:700}
  </style>
