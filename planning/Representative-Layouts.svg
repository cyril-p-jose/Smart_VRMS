<rect x="250" y="260" width="642" height="228" rx="8" class="panel"/><text x="269" y="294" class="h">Package assignments</text><text x="269" y="327" class="small">Vehicle / driver</text><text x="758" y="327" class="small">2-day amount</text><line x1="269" y1="339" x2="871" y2="339" class="line"/><text x="269" y="367" class="bold">Touring car 01</text><text x="783" y="367">INR 4,800</text><text x="269" y="394" class="small">Driver D-002 · licence / leave checked</text><text x="783" y="394">INR 1,600</text><line x1="269" y1="408" x2="871" y2="408" class="line"/><text x="269" y="438" class="bold">Scooter 01</text><text x="783" y="438">INR 1,200</text><text x="269" y="466" class="small">No driver · each physical vehicle is distinct</text>
