<rect x="913" y="134" width="357" height="501" rx="8" class="panel"/><text x="934" y="169" class="h">Financial review</text><text x="934" y="208">Vehicle charges</text><text x="1156" y="208">6,000</text><text x="934" y="242">Driver charge</text><text x="1156" y="242">1,600</text><line x1="934" y1="262" x2="1249" y2="262" class="line"/><text x="934" y="294" class="bold">Before applicable tax</text><text x="1141" y="294" class="money">7,600</text><rect x="934" y="315" width="315" height="73" rx="5" fill="#fff3dc"/><text x="946" y="340" class="warn status">DEMO · NOT FOR TAX USE</text><text x="946" y="367" class="small">Company tax status must be verified.</text><text x="934" y="423">Advance received</text><text x="1156" y="423">1,000</text><text x="934" y="458">Refundable deposit held</text><text x="1191" y="458">0</text><text x="934" y="504" class="bold">Provisional balance</text><text x="1141" y="504" class="money">6,600</text><text x="934" y="547" class="small">Payment request / bank-approved QR</text><text x="934" y="574" class="small">does not prove receipt of funds.</text><text x="934" y="608" class="small">Illustrative rates; no real tax invoice.</text>
<rect x="250" y="653" width="1020" height="63" rx="8" class="panel"/><text x="270" y="690" class="small">The whole package will be reserved. Email delivery status remains visible.</text><rect x="966" y="666" width="87" height="37" rx="5" fill="#edf2f7"/><text x="988" y="690">Back</text><rect x="1069" y="666" width="179" height="37" rx="5" class="btn"/><text x="1091" y="690" class="white bold">Confirm package</text>
</g>

